<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404 · Nothing here</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #1b2233 0%, #0d1017 60%, #090b10 100%);
    color: #e8eaf0;
    padding: 2rem 1rem;
  }
  main {
    display: grid;
    gap: 1.25rem;
    justify-items: center;
    text-align: center;
    max-width: 34rem;
  }
  .code {
    font-size: clamp(4.5rem, 18vw, 9rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    background: linear-gradient(120deg, #7aa2ff, #b48cff, #ff8fa3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { font-size: clamp(1rem, 3.5vw, 1.25rem); font-weight: 600; }
  p.sub { font-size: 0.9rem; color: #9aa3b5; max-width: 30rem; }
  hr {
    width: 100%;
    border: 0;
    border-top: 1px solid #232838;
    margin: 1rem 0 0;
  }
  footer { font-size: 0.78rem; color: #8a93a6; line-height: 1.7; text-align: center; }
  footer b { color: #b6bdcc; font-weight: 600; }
  a { color: #a7b7ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .impressum {
    font-size: 0.78rem;
    color: #8a93a6;
    line-height: 1.8;
    text-align: left;
  }
  .impressum h2 {
    font-size: 0.82rem;
    color: #b6bdcc;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }
  @media (prefers-reduced-motion: no-preference) {
    .code {
      animation: shimmer 8s ease-in-out infinite alternate;
      background-size: 200% 200%;
    }
    @keyframes shimmer {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }
  }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Hier ist nichts belegt.</h1>
  <p class="sub">Diese (Sub-)Domain läuft über unseren Server, gehört aber aktuell zu keiner Anwendung.</p>
  <hr>
  <div class="impressum">
    <h2>Impressum</h2>
    <p>
      Mayra Ostheimer<br>
      Ringstraße 60, 25368 Kiebitzreihe<br>
      Tel: 017663787951<br>
      Mail: <a href="mailto:mail@mostheimer.de">mail@mostheimer.de</a>
    </p>
  </div>
</main>
</body>
</html>
