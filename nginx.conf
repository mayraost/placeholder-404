server {
    listen 3000;
    server_name _;

    root /srv/placeholder;

    # Kein Verzeichnislisting, keine nginx-Versionsanzeige
    autoindex off;
    server_tokens off;

    charset utf-8;

    # Alles, was keine App ist: 404 mit der Placeholder-Seite
    error_page 404 /404.html;

    # Site-Hosts, deren App gerade nicht läuft: 503 mit Wartungsseite.
    # Semantisch korrekt (der Host ist belegt, nur der Ursprung fehlt) und am
    # Cloudflare-Edge die Voraussetzung dafür, dass `stale-if-error` greift —
    # ein gecachtes 404 würde 30 Tage als „gelöscht" stehen bleiben.
    error_page 503 /503.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        # Sicherheits-Header auch auf der 404-Antwort (die vom Traefik-Catch-All
        # ausgelieferte Seite ist der sichtbare „Rahmen" für jeden toten Host)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'none'; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = /503.html {
        internal;
        add_header Cache-Control "no-store" always;
        # Wartungsseite darf nie als Inhalt indexiert werden; die Seite selbst
        # (HTML-Meta) sagt dasselbe, der Header gilt auch für Proxies.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'none'; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Stylesheet + selbst gehostete Fonts (nur diese Assets, sonst nichts).
    # Bewusst host-unabhängig: eine 503-Seite braucht ihr CSS, sonst bleibt sie
    # ungestylt — Assets sind kein Content und nie von der Wartung betroffen.
    location = /style.css {
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        return 404;
        access_log off;
    }

    location /fonts/ {
        types {
            font/woff2 woff2;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Nur die tatsächlich referenzierten Dateien, kein Traversal-Ersatzweg
        try_files $uri =404;
    }

    location / {
        # $host ist immer lowercase und ohne Port (Host-Header bzw. Request-Line).
        # `if` ausschließlich mit `return` — die einzige sichere if-Verwendung.
        if ($host = mostheimer.de) {
            return 503;
        }
        if ($host = www.mostheimer.de) {
            return 503;
        }
        return 404;
    }
}
